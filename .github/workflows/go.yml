name: Go checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - name: Tests and race detector
        run: go test -race -cover ./...
      - name: Static checks
        run: go vet ./...
